name: Generate and bundle original certificate design library

on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/import-openclipart-certificates.mjs"
      - ".github/workflows/import-certificate-library.yml"
  workflow_dispatch:
    inputs:
      max_assets:
        description: "Number of original certificate SVG designs to generate (default 1000)"
        required: false
        default: "1000"

permissions:
  contents: write

concurrency:
  group: populate-certificate-library-v2-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  import-library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out studio source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate 1,000 original local certificate SVGs
        env:
          MAX_CERTIFICATE_ASSETS: ${{ github.event.inputs.max_assets || '1000' }}
        run: node scripts/import-openclipart-certificates.mjs

      - name: Commit generated certificate gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/templates.json templates/web-certificates/
          if git diff --cached --quiet; then
            echo "No new bundled certificate assets to commit."
          else
            git commit -m "Bundle discovered certificate designs into Joes Studio"
            git push origin HEAD:${{ github.ref_name }}
          fi
