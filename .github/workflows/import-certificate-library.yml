name: Download licensed certificate artwork

on:
  workflow_dispatch:
    inputs:
      max_assets:
        description: "Maximum number of existing licensed certificate SVGs to download (not generated)"
        required: false
        default: "1000"
  push:
    branches:
      - main
    paths:
      - "scripts/import-openclipart-certificates.mjs"
      - ".github/workflows/import-certificate-library.yml"

permissions:
  contents: write

concurrency:
  group: download-certificate-artwork-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  download-library:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out studio source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download existing licensed SVG certificate artwork
        env:
          MAX_CERTIFICATE_ASSETS: ${{ github.event.inputs.max_assets || '1000' }}
        run: node scripts/import-openclipart-certificates.mjs

      - name: Commit downloaded artwork and source metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A templates/templates.json templates/web-certificates/
          if git diff --cached --quiet; then
            echo "No catalogue changes."
          else
            git commit -m "Import verified licensed certificate originals"
            # Rebase if website edits land while this download job is running.
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:${{ github.ref_name }}
          fi
